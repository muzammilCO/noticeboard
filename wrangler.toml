name = "noticeboard"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_OWNER = "your-username"
GITHUB_REPO = "noticeboard"
GITHUB_WORKFLOW_FILE = "send-notification.yml"
GITHUB_REF = "main"

# Set the token secret with:
#   wrangler secret put GITHUB_TOKEN
